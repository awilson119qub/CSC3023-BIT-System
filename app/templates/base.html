<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UConnect</title>

    <!-- Upload Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Upload Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- styles.css -->
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet" type="text/css">
</head>
<body>

    <!-- Header -->
    <header class="bg-white shadow-sm py-2">
        <div class="container text-center">
            <img src="{{ url_for('static', filename='image/uconnectlogo.png') }}"
                 alt="UConnect Logo"
                 style="height:60px; object-fit:contain;">
        </div>
    </header>

    <!-- Bottom Navbar -->
    <nav class="navbar fixed-bottom bg-body-tertiary border-top">
        <div class="container-fluid justify-content-around">

            <a class="nav-link {% if request.endpoint == 'newsfeed' %}active{% endif %}" href="{{ url_for('newsfeed') }}">
                <i class="fa-regular fa-house"></i>
            </a>

            <a class="nav-link {% if request.endpoint == 'search' %}active{% endif %}" href="{{ url_for('search') }}">
                <i class="fa-solid fa-magnifying-glass"></i>
            </a>

            <a class="nav-link {% if request.endpoint == 'message' %}active{% endif %}" href="{{ url_for('message') }}">
                <i class="fa-regular fa-message"></i>
            </a>

            <a class="nav-link {% if request.endpoint == 'notification' %}active{% endif %}" href="{{ url_for('notification') }}">
                <i class="fa-regular fa-bell"></i>
            </a>

            <a class="nav-link {% if request.endpoint == 'profile' %}active{% endif %}" href="{{ url_for('profile') }}">
                <i class="fa-regular fa-circle-user"></i>
            </a>

        </div>
    </nav>

    <!-- Main -->
    <main class="container pb-5" style="max-width: 520px;">
       {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="rounded-3 px-3 py-2 mt-3 mb-3 shadow-sm"
                         style="background-color: #f8eaea; color: #990000;">
                     {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block app_content %}
        {% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
